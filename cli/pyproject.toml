[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creovis"
version = "0.1.0"
description = "CLI for CREOVIS: clip long videos into vertical shorts and publish them, from the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "CREOVIS" }]
keywords = ["video", "clips", "shorts", "ai", "tiktok", "youtube-shorts", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://www.creovis.app"
Documentation = "https://www.creovis.app/mcp"

[project.scripts]
creovis = "creovis_cli:main"
openshorts = "openshorts_cli:main"

[tool.setuptools]
py-modules = ["creovis_cli", "openshorts_cli"]
