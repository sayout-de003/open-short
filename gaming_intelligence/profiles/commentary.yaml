# Commentary Profile Configuration
name: commentary
description: "Optimized for reactions, tutorials, vlogs, and commentary over visual demonstrations."
weights:
  visual: 0.30
  audio: 0.30
  transcript: 0.30
  context: 0.10

clip_limits:
  min_duration: 20.0
  max_duration: 60.0
  target_count: 5

thresholds:
  motion_significance: 0.15
  audio_spike_percentile: 80.0
  scene_change_boost: 0.10
  silence_allowed: true
